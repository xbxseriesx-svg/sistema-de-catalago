<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Imagens — ASTERYON</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f13;color:#f5f5f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0f0f13}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid #2c2c35;background:rgba(15,15,19,.96);backdrop-filter:blur(12px)}
    .title{min-width:0;flex:1}.title strong{display:block;font-size:15px}.title span{display:block;margin-top:3px;color:#a1a1aa;font-size:12px}
    .close{height:36px;padding:0 14px;border:1px solid #3f3f46;border-radius:8px;background:#18181b;color:#fff;cursor:pointer}
    #status{padding:11px 18px;border-bottom:1px solid #25252d;color:#c7c7d0;font-size:12px;min-height:42px}
    #status.error{color:#fca5a5}#status.success{color:#86efac}
    #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:18px}
    .card{display:flex;flex-direction:column;min-height:270px;overflow:hidden;border:1px solid #30303a;border-radius:12px;background:#17171c}
    .thumb{height:175px;display:grid;place-items:center;padding:10px;background:#f7f7f7}.thumb img{width:100%;height:100%;object-fit:contain}
    .meta{padding:10px 11px 8px;min-height:52px;color:#d4d4d8;font-size:11px;line-height:1.35;overflow:hidden}
    .use{margin:auto 10px 10px;height:36px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer}.use:disabled{opacity:.55;cursor:wait}
    .empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:#a1a1aa}
    .successBox{grid-column:1/-1;display:grid;place-items:center;gap:14px;padding:30px}.successBox img{max-width:min(440px,80vw);max-height:300px;object-fit:contain;background:#fff;border-radius:12px;padding:18px}.successBox strong{font-size:15px}
  </style>
</head>
<body>
  <header>
    <div class="title"><strong>Google Imagens — selecionar logo</strong><span id="brandName">Carregando marca...</span></div>
    <button class="close" type="button" id="closeBtn">Fechar</button>
  </header>
  <div id="status">Consultando Google Imagens...</div>
  <main id="grid"><div class="empty">Carregando resultados do Google...</div></main>
  <script defer src="/google-image-picker-v73.js?v=74"></script>
</body>
</html>
