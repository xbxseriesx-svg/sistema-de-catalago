name: ASTERYON v2.1 → Cloudflare D1 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_NAME: sistema-de-catalago
  D1_DATABASE_NAME: sistema-de-catalago
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar autorização Cloudflare
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Build do Editor + Portal
        run: npm run build

      - name: Localizar ou criar banco D1
        shell: bash
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          LIST=$(curl -fsS "$API?name=$D1_DATABASE_NAME" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          D1_ID=$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.result||[]).find(d=>d.name===process.env.D1_DATABASE_NAME);if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$D1_ID" ]; then
            echo "Criando D1 $D1_DATABASE_NAME..."
            CREATED=$(curl -fsS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"name\":\"$D1_DATABASE_NAME\"}")
            D1_ID=$(printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success) throw new Error(JSON.stringify(j.errors));process.stdout.write(j.result.uuid||j.result.id||'')})")
          fi
          test -n "$D1_ID" || (echo "Não foi possível obter o ID do D1" && exit 1)
          echo "D1_DATABASE_ID=$D1_ID" >> "$GITHUB_ENV"
          echo "D1 pronto: $D1_DATABASE_NAME ($D1_ID)"

      - name: Gerar configuração Wrangler de produção
        run: node scripts/make-wrangler.mjs

      - name: Aplicar migrations D1
        run: npx --yes wrangler@4.68.0 d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.deploy.jsonc

      - name: Deploy do Worker sistema-de-catalago
        run: npx --yes wrangler@4.68.0 deploy --config wrangler.deploy.jsonc

      - name: Configurar token de ativação do primeiro SDM
        id: bootstrap
        shell: bash
        env:
          CONFIGURED_BOOTSTRAP_TOKEN: ${{ secrets.SDM_BOOTSTRAP_TOKEN }}
        run: |
          mkdir -p deploy-info
          TOKEN="$CONFIGURED_BOOTSTRAP_TOKEN"
          GENERATED=false
          if [ -z "$TOKEN" ]; then
            TOKEN=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
            GENERATED=true
          fi
          printf '%s' "$TOKEN" | npx --yes wrangler@4.68.0 secret put SDM_BOOTSTRAP_TOKEN --config wrangler.deploy.jsonc
          echo "Worker: $WORKER_NAME" > deploy-info/DEPLOY.txt
          echo "D1: $D1_DATABASE_NAME ($D1_DATABASE_ID)" >> deploy-info/DEPLOY.txt
          echo "R2: DESATIVADO" >> deploy-info/DEPLOY.txt
          if [ "$GENERATED" = true ]; then
            printf '%s\n' "$TOKEN" > deploy-info/SDM_BOOTSTRAP_TOKEN.txt
            echo "bootstrap_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Token SDM veio do secret SDM_BOOTSTRAP_TOKEN do GitHub." >> deploy-info/DEPLOY.txt
            echo "bootstrap_generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar informações do deploy
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-v2.1-Cloudflare-Deploy-Info
          path: deploy-info/*
          if-no-files-found: error
