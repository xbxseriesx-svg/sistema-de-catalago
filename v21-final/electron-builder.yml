appId: br.com.asteryon.catalogo.unificado.v21.test
productName: ASTERYON Catálogo Digital 2.1 TESTE
asar: true
files:
  - dist/**/*
  - desktop/**/*
  - package.json
directories:
  output: release
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ASTERYON Catálogo Digital 2.1 TESTE
  uninstallDisplayName: ASTERYON Catálogo Digital 2.1 TESTE
  deleteAppDataOnUninstall: false
  runAfterFinish: true
