name: TEMP patch V92 Team4 preflight order

on:
  push:
    branches:
      - audit/v92-team4-preview-parity-20260820

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v92-team4-preview-parity-20260820
      - name: Fazer Equipe 4 aprovar antes da substituição da árvore
        run: |
          node <<'NODE'
          const fs = require('fs');

          const capturePath = 'public/preview-editor-v91-capture.js';
          let capture = fs.readFileSync(capturePath, 'utf8');
          const oldCapture = `      if (!report.ok) return block(event, 'A cópia do Preview Final não passou na validação de equivalência.', report);\n      const refs = S.replaceTemplateNodes(result.modelName, result.nodes);`;
          const newCapture = `      if (!report.ok) return block(event, 'A cópia do Preview Final não passou na validação de equivalência.', report);\n      const team4Request = { result, group3Report: report, team4Report: null };\n      window.dispatchEvent(new CustomEvent('asteryon:team4-preflight-request-v92', { detail: team4Request }));\n      if (window.__ASTERYON_V92_GROUPS__ && team4Request.team4Report?.ok !== true) {\n        return block(event, 'A Equipe 4 reprovou a equivalência antes da substituição da árvore.', team4Request.team4Report);\n      }\n      const refs = S.replaceTemplateNodes(result.modelName, result.nodes);`;
          if (!capture.includes(oldCapture)) throw new Error('Trecho de captura V91 esperado não encontrado.');
          capture = capture.replace(oldCapture, newCapture);
          fs.writeFileSync(capturePath, capture);

          const team4Path = 'public/preview-editor-v92-team4.js';
          let team4 = fs.readFileSync(team4Path, 'utf8');
          const oldSignature = `  function verifyPreflight(group3Report) {\n    const shell = document.getElementById(PREVIEW_ID)?.querySelector('.ltp-shell');\n    const nodes = expectedNodes();`;
          const newSignature = `  function verifyPreflight(group3Report, candidate = null) {\n    const shell = candidate?.shell || document.getElementById(PREVIEW_ID)?.querySelector('.ltp-shell');\n    const nodes = candidate?.nodes || expectedNodes();`;
          if (!team4.includes(oldSignature)) throw new Error('Assinatura de preflight da Equipe 4 não encontrada.');
          team4 = team4.replace(oldSignature, newSignature);

          const oldListener = `  window.addEventListener('asteryon:preview-final-copied-v91', (event) => {\n    state.group3Apply = event.detail || null;\n    verifyPreflight(state.group3Apply);\n  });`;
          const newListener = `  window.addEventListener('asteryon:team4-preflight-request-v92', (event) => {\n    state.group3Apply = event.detail?.group3Report || null;\n    const report = verifyPreflight(state.group3Apply, event.detail?.result || null);\n    if (event.detail) event.detail.team4Report = report;\n  });\n  window.addEventListener('asteryon:preview-final-copied-v91', (event) => {\n    state.group3Apply = event.detail || state.group3Apply || null;\n    if (!state.preflight) verifyPreflight(state.group3Apply);\n  });`;
          if (!team4.includes(oldListener)) throw new Error('Listener pós-cópia da Equipe 4 não encontrado.');
          team4 = team4.replace(oldListener, newListener);
          fs.writeFileSync(team4Path, team4);
          NODE
      - name: Validar sintaxe
        run: |
          node --check public/preview-editor-v91-capture.js
          node --check public/preview-editor-v92-team4.js
      - name: Gravar patch de ordem
        run: |
          if git diff --quiet -- public/preview-editor-v91-capture.js public/preview-editor-v92-team4.js; then
            echo "Ordem já corrigida."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/preview-editor-v91-capture.js public/preview-editor-v92-team4.js
          git commit -m "fix: require Team 4 preflight before template mutation [skip ci]"
          git push origin HEAD:audit/v92-team4-preview-parity-20260820
