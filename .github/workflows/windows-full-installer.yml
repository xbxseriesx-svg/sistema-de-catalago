name: Windows 11 Full Local AI Installer

on:
  push:
    branches:
      - build/windows11-full-local-ai
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ASTERYON icon
        run: |
          python -m pip install pillow
          python desktop/make_icon.py

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create test guide
        shell: pwsh
        run: |
          @"
          ASTERYON CATÁLOGO DIGITAL — WINDOWS 11 TESTE 1.6 / FREEDOM V2
          =================================================================

          INSTALAÇÃO
          1. Execute ASTERYON_Catalogo_Setup_Windows11_TESTE_1.6.0-test.exe.
          2. Escolha a pasta de instalação.
          3. O instalador cria atalhos no Menu Iniciar e Área de Trabalho.

          LOGIN ADMIN LOCAL
          E-mail: admin@empresa.com.br
          Senha: admin123

          NOVO EDITOR — FREEDOM V2
          - Esta versão inicia com uma PRANCHETA LIMPA para você construir a página do zero.
          - A versão 1.6 usa um novo armazenamento local de teste para não carregar os layouts rígidos da versão 1.5.
          - Clique em um elemento na biblioteca para inseri-lo diretamente no Modo Livre.
          - Arraste um elemento da biblioteca para um drop zone quando quiser usar estrutura organizada.
          - O Modo Livre usa X, Y, largura, altura, camada e rotação em valores reais.
          - Foram removidos os botões fixos Auto/25%/33%/50%/66%/75%/100% do redimensionamento visual.
          - O elemento selecionado possui 8 alças: cima, baixo, esquerda, direita e quatro cantos.
          - Use Mover para posicionar o elemento diretamente na prancheta.
          - Zoom da prancheta disponível no topo do canvas.
          - Grade e Snap podem ser ligados/desligados em Página.

          PAINEL DIREITO SEPARADO
          - Elemento: altera SOMENTE o item selecionado.
          - Página: altera SOMENTE fundo, imagem, tamanho da prancheta e grade.
          - Global: tokens gerais, fontes e cores globais.
          - Identidade: nome, logo e dimensões da marca.
          - Tema: efeitos/presets temáticos.
          - Ao selecionar um elemento o painel muda automaticamente para Elemento.

          CONTEÚDO LIVRE
          - Frame, Card, Header, Footer, Hero, Banner e Vitrine podem receber elementos internos independentes.
          - Em componentes com conteúdo pronto, desligue "Usar conteúdo pronto deste componente" para transformá-lo em um quadro vazio.
          - Dentro de um quadro você pode adicionar Texto, Botão, Imagem, Pesquisa, Card, Produto ou outro Frame.
          - Cada filho possui edição, posição, tamanho, fonte, fundo e visibilidade próprios.
          - Existe opção Página > Limpar todos os elementos para começar novamente do zero; Ctrl+Z pode desfazer.

          VITRINE
          - A vitrine deixou de ser um bloco fechado.
          - Configure fonte de dados, filtro, quantidade, cabeçalho, kicker e contador.
          - Escolha individualmente os campos do card: imagem, marca, nome, breadcrumb, preço e botão.
          - Altere texto do botão, largura mínima, colunas, gap, padding, altura da imagem, radius e fundo dos cards.
          - Desative o conteúdo pronto da vitrine e monte elementos livres dentro dela quando desejar composição manual.

          LOGO / IDENTIDADE
          - Logo e nome agora ocupam caixas independentes e não devem se sobrepor.
          - Ajuste largura máxima, altura máxima e espaçamento logo/nome em Identidade.
          - O nome pode ser ocultado quando a própria arte da logo já contém o nome da empresa.

          IA GRATUITA — OLLAMA COM DIAGNÓSTICO
          - Abra ASTERYON AI > Configuração > Preparar IA automaticamente.
          - O programa detecta o executável padrão do Ollama, tenta iniciar a API local, baixa o modelo e executa um autoteste real.
          - Modelo recomendado: Qwen3 4B.
          - A geração só é liberada após um teste real aprovado.
          - Abra Diagnóstico da IA para verificar API local, versão, executável, modelo instalado, autoteste, último erro e server.log.
          - O sistema não mascara erro do Ollama com fallback silencioso no aplicativo Windows.
          - Pesquisa web é opcional e apenas como inspiração.

          IMPORTAÇÃO
          - Botão Importar na barra superior.
          - Planilhas .xlsx/.xls/.csv.
          - Imagens por código: 10001.png, 10001_2.jpg ou 10001-1.webp.

          SEGURANÇA DA IA
          - Gerar -> Preview -> Aprovar -> Aplicar ao Rascunho.
          - Nunca publica automaticamente.
          - Não altera preços ou produtos reais automaticamente.
          - Não copia conteúdo da Internet.

          OBSERVAÇÃO
          - O instalador de teste não possui assinatura digital comercial; o SmartScreen pode mostrar aviso.
          "@ | Set-Content -Path release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -Encoding UTF8

      - name: Package installer and guide
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador não encontrado" }
          Compress-Archive -Path $installer.FullName,release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -DestinationPath release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v1.6-Freedom-V2
          path: |
            release/ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe
            release/LEIA-ME_ASTERYON_Windows11_TESTE.txt
            release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip
          if-no-files-found: error
          retention-days: 14
