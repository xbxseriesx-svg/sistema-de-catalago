name: Windows 11 Full Local AI Installer

on:
  push:
    branches:
      - build/windows11-full-local-ai
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ASTERYON icon
        run: |
          python -m pip install pillow
          python desktop/make_icon.py

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create test guide
        shell: pwsh
        run: |
          @"
          ASTERYON CATÁLOGO DIGITAL — WINDOWS 11 TESTE 1.7 / CANVAS LIVRE
          ==================================================================

          INSTALAÇÃO
          1. Execute ASTERYON_Catalogo_Setup_Windows11_TESTE_1.7.0-test.exe.
          2. Escolha a pasta de instalação.
          3. O instalador cria atalhos no Menu Iniciar e Área de Trabalho.

          LOGIN ADMIN LOCAL
          E-mail: admin@empresa.com.br
          Senha: admin123

          CANVAS LIVRE — ESTILO CONSTRUTOR VISUAL
          - A página inteira agora é uma prancheta de posicionamento livre.
          - Arraste QUALQUER item da biblioteca e solte diretamente no ponto desejado da página.
          - Banner, Hero, Vitrine, Produto, Card, Texto, Imagem, Vídeo, Galeria, Pesquisa, Header, Footer, Frame, Container, Linha e Coluna podem ser posicionados livremente.
          - Não existe mais obrigação de encaixar o elemento em uma linha ou seção para poder movê-lo.
          - Passe o mouse no elemento para exibir a alça azul de arraste.
          - Selecione o elemento e arraste também pela própria superfície quando não estiver sobre botão/campo interativo.
          - Redimensionamento livre pelas 8 alças: quatro lados e quatro cantos.
          - X, Y, largura, altura, camada e rotação podem ser informados manualmente no painel do elemento.
          - Os antigos atalhos de largura fixa em porcentagem não aparecem no canvas livre.
          - Elementos podem se sobrepor.
          - Clique com o botão direito no elemento para Duplicar, Trazer para frente, Enviar para trás, Bloquear ou Excluir.
          - Grade e Snap continuam opcionais em Página.
          - Zoom disponível no topo da prancheta.

          PAINEL DIREITO
          - Elemento: altera somente o item selecionado.
          - Página: altera apenas fundo, imagem, dimensões da página, grade e snap.
          - Global: tokens e estilos globais.
          - Identidade: logo, nome e dimensões da marca.
          - Tema: efeitos e presets.

          CONTEÚDO E CATÁLOGO
          - Vitrines continuam conectadas aos dados, mas o bloco inteiro pode ser movido e redimensionado livremente.
          - Cards e produtos podem ser usados isoladamente em qualquer posição.
          - Frames e estruturas podem receber conteúdo interno quando você quiser agrupar elementos.
          - A barra de pesquisa é um elemento independente e pode ser colocada onde quiser.

          IA GRATUITA — OLLAMA COM DIAGNÓSTICO
          - Abra ASTERYON AI > Configuração > Preparar IA automaticamente.
          - O programa detecta o Ollama, inicia a API local, baixa o modelo e executa autoteste real.
          - Modelo recomendado: Qwen3 4B.
          - Diagnóstico mostra API, versão, executável, modelo, autoteste, último erro e logs.
          - Pesquisa web é opcional e somente como inspiração.
          - Fluxo: Gerar -> Preview -> Aprovar -> Aplicar ao Rascunho.

          IMPORTAÇÃO
          - Botão Importar na barra superior.
          - Planilhas .xlsx/.xls/.csv.
          - Imagens por código: 10001.png, 10001_2.jpg ou 10001-1.webp.

          OBSERVAÇÃO
          - O instalador de teste não possui assinatura digital comercial; o SmartScreen pode mostrar aviso.
          "@ | Set-Content -Path release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -Encoding UTF8

      - name: Package installer and guide
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador não encontrado" }
          Compress-Archive -Path $installer.FullName,release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -DestinationPath release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v1.7-Unrestricted-Canvas
          path: |
            release/ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe
            release/LEIA-ME_ASTERYON_Windows11_TESTE.txt
            release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip
          if-no-files-found: error
          retention-days: 14
