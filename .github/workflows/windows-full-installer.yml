name: Windows 11 Creative Editor Installer

on:
  push:
    branches:
      - feature/editor-creative-v3
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ASTERYON icon
        run: |
          python -m pip install pillow
          python desktop/make_icon.py

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create test guide
        shell: pwsh
        run: |
          @"
          ASTERYON CATÁLOGO DIGITAL — WINDOWS 11 TESTE 1.8 / EDITOR CRIATIVO V3
          ======================================================================

          INSTALAÇÃO
          1. Execute ASTERYON_Catalogo_Setup_Windows11_TESTE_1.8.0-test.exe.
          2. Escolha a pasta de instalação.
          3. O instalador cria atalhos no Menu Iniciar e Área de Trabalho.

          LOGIN ADMIN LOCAL
          E-mail: admin@empresa.com.br
          Senha: admin123

          NOVO EDITOR CRIATIVO
          - Página em branco como ponto de partida.
          - Biblioteca simplificada com modo Iniciante e Avançado.
          - Texto: clique em Texto e depois na página para começar; duplo clique edita diretamente no canvas.
          - Imagem, botão, vídeo, forma e produto podem ficar em qualquer posição.
          - Não existe obrigação de Container, Linha, Coluna ou Grid.
          - Elementos podem se sobrepor livremente.
          - Resize livre pelas oito alças.
          - Guias visuais ajudam no alinhamento sem prender o elemento.
          - Shift + clique permite selecionar mais de um objeto.
          - Ctrl + D duplica.
          - Ctrl + G agrupa.
          - Ctrl + Shift + G desagrupa.
          - Ctrl + ] traz uma camada para frente.
          - Ctrl + [ envia uma camada para trás.
          - Setas movem 1 px; Shift + seta move 10 px.
          - Delete remove os objetos selecionados.

          CAMADAS
          - Abra a aba Camadas no painel esquerdo.
          - Arraste itens para reorganizar profundidade.
          - Ocultar, bloquear e renomear ficam na própria árvore.
          - Objetos sobrepostos também podem ser escolhidos por uma lista diretamente no canvas.

          OBJETOS ATÔMICOS
          - Produto não é mais um card fechado.
          - Ao adicionar Produto, imagem, marca, nome, preço e botão são objetos independentes dentro de um grupo.
          - Vitrine também é criada como composição desmontável.
          - Cabeçalho, Rodapé e Categoria seguem a mesma filosofia.
          - Use Desagrupar para transformar modelos em objetos totalmente independentes.

          PAINEL DIREITO SIMPLIFICADO
          - Aparência: cor, fonte, tamanho, transparência, sombra e borda arredondada.
          - Posição: X, Y, largura, altura e rotação.
          - Camadas: Frente, Topo, Trás, Fundo, Bloquear e Ocultar.
          - Opções técnicas ficam escondidas em Mais opções.
          - Fundo da página aparece quando nenhum objeto está selecionado.

          HISTÓRICO VISUAL
          - Aba Histórico exibe miniaturas simplificadas dos snapshots.
          - É possível restaurar um estado anterior com um clique.

          RESPONSIVIDADE
          - Use somente Desktop, Tablet e Mobile na barra superior.
          - Cada modo mantém dimensões e posições próprias.

          IMPORTAÇÃO
          - A configuração mais nova da planilha Winthor está incluída nesta versão.
          - Formatos: .xlsx, .xls e .csv.

          IA
          - ASTERYON AI permanece disponível como recurso auxiliar.
          - A prioridade desta versão é o Editor Criativo.

          OBSERVAÇÃO
          - Instalador de teste sem assinatura digital comercial; o SmartScreen pode mostrar aviso.
          "@ | Set-Content -Path release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -Encoding UTF8

      - name: Package installer and guide
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador não encontrado" }
          Compress-Archive -Path $installer.FullName,release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -DestinationPath release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v1.8-Creative-Editor
          path: |
            release/ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe
            release/LEIA-ME_ASTERYON_Windows11_TESTE.txt
            release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip
          if-no-files-found: error
          retention-days: 14
