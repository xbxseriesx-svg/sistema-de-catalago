name: Windows 11 Full Local AI Installer

on:
  push:
    branches:
      - build/windows11-full-local-ai
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ASTERYON icon
        run: |
          python -m pip install pillow
          python desktop/make_icon.py

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create test guide
        shell: pwsh
        run: |
          @"
          ASTERYON CATÁLOGO DIGITAL — WINDOWS 11 TESTE 1.5
          =================================================

          INSTALAÇÃO
          1. Execute ASTERYON_Catalogo_Setup_Windows11_TESTE_1.5.0-test.exe.
          2. Escolha a pasta de instalação.
          3. O instalador cria atalhos no Menu Iniciar e Área de Trabalho.

          LOGIN ADMIN LOCAL
          E-mail: admin@empresa.com.br
          Senha: admin123

          IA GRATUITA — CORREÇÃO COMPLETA OLLAMA
          - Abra ASTERYON AI > Configuração.
          - Use o botão Preparar IA automaticamente.
          - O ASTERYON instala/ativa o Ollama quando necessário, baixa o modelo selecionado via API local oficial e executa um teste real.
          - Modelo recomendado: Qwen3 4B.
          - A geração só é liberada quando o modelo realmente estiver instalado e respondendo.
          - Erros do Ollama agora aparecem na tela; o sistema não mascara falha do desktop com um fallback silencioso.
          - Pesquisa web é opcional e somente como inspiração.

          EDITOR LIVRE
          - Cada elemento tem edição própria e contextual.
          - Clique no fundo para editar somente o fundo/página.
          - Clique em texto, card, banner, busca etc. para editar somente aquele elemento.
          - Banner, Hero, Card, Texto, Imagem, Botão e Barra de Pesquisa podem usar Modo Livre.
          - No Modo Livre, use Mover para arrastar o elemento no canvas e as alças para redimensionar.
          - X, Y, largura, altura, camada e rotação são independentes por Desktop/Tablet/Mobile.
          - Presets: Auto, 25%, 33%, 50%, 66%, 75% e 100%.
          - Elementos não são mais forçados a preencher 100% da página quando selecionados.

          EDIÇÃO POR ITEM
          - Fontes ficam no painel correto, não na barra superior.
          - Título, subtítulo, descrição e CTA de banners/cards possuem controles separados.
          - A Barra de Pesquisa agora é um elemento independente: pode adicionar, duplicar, mover ou excluir quando quiser.
          - A busca antiga embutida no Header pode ser desligada.

          IMPORTAÇÃO
          - Botão Importar na barra superior.
          - Planilhas .xlsx/.xls/.csv.
          - Imagens por código: 10001.png, 10001_2.jpg ou 10001-1.webp.

          SEGURANÇA DA IA
          - Gerar -> Preview -> Aprovar -> Aplicar ao Rascunho.
          - Nunca publica automaticamente.
          - Não altera preços ou produtos reais automaticamente.
          - Não copia conteúdo da Internet.

          OBSERVAÇÃO
          - O instalador de teste não possui assinatura digital comercial; o SmartScreen pode mostrar aviso.
          "@ | Set-Content -Path release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -Encoding UTF8

      - name: Package installer and guide
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador não encontrado" }
          Compress-Archive -Path $installer.FullName,release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -DestinationPath release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v1.5-FreeCanvas-AI
          path: |
            release/ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe
            release/LEIA-ME_ASTERYON_Windows11_TESTE.txt
            release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip
          if-no-files-found: error
          retention-days: 14
