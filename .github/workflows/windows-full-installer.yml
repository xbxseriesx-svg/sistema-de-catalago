name: Windows 11 Full Local AI Installer

on:
  push:
    branches:
      - build/windows11-full-local-ai
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate ASTERYON icon
        run: |
          python -m pip install pillow
          python desktop/make_icon.py

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create test guide
        shell: pwsh
        run: |
          @"
          ASTERYON CATÁLOGO DIGITAL — WINDOWS 11 TESTE 1.2
          =================================================

          INSTALAÇÃO
          1. Execute o instalador ASTERYON_Catalogo_Setup_Windows11_TESTE_1.2.0-test.exe.
          2. Escolha a pasta de instalação.
          3. O instalador cria atalhos no Menu Iniciar e Área de Trabalho.

          LOGIN ADMIN LOCAL
          E-mail: admin@empresa.com.br
          Senha: admin123

          IA GRATUITA
          - Abra ASTERYON AI > Configuração.
          - Clique em Instalar Ollama. O Windows iniciará a instalação gratuita.
          - Depois clique em Verificar/Salvar e em Baixar modelo.
          - Modelo recomendado: Qwen3 4B.
          - Não usa API Key nem créditos pagos.
          - A pesquisa web só é usada quando marcada e serve apenas como inspiração.

          IMPORTAÇÃO
          - Botão Importar na barra superior.
          - Planilhas .xlsx/.xls/.csv.
          - Imagens por código: 10001.png, 10001_2.jpg ou 10001-1.webp.
          - Os dados ficam localmente no computador para teste.

          FONTES E INTERFACE
          - Barra superior reorganizada com rolagem horizontal quando necessário.
          - Seletor global com fontes populares.
          - Desktop, Tablet e Mobile continuam disponíveis.

          SEGURANÇA DA IA
          - Gerar -> Preview -> Aprovar -> Aplicar ao Rascunho.
          - Nunca publica automaticamente.
          - Não altera preços ou produtos reais automaticamente.
          - Não copia conteúdo da Internet.

          OBSERVAÇÃO
          - O motor de texto e pesquisa é gratuito/local.
          - Geração de imagens local pesada ainda exige módulo opcional compatível com GPU (ex.: ComfyUI); nesta versão a IA gera briefing/prompt original.
          - O instalador de teste não possui assinatura digital comercial; o SmartScreen pode mostrar aviso.
          "@ | Set-Content -Path release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -Encoding UTF8

      - name: Package installer and guide
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador não encontrado" }
          Compress-Archive -Path $installer.FullName,release/LEIA-ME_ASTERYON_Windows11_TESTE.txt -DestinationPath release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-Free-AI-Teste
          path: |
            release/ASTERYON_Catalogo_Setup_Windows11_TESTE_*.exe
            release/LEIA-ME_ASTERYON_Windows11_TESTE.txt
            release/ASTERYON_Catalogo_Windows11_TESTE_Completo.zip
          if-no-files-found: error
          retention-days: 14
