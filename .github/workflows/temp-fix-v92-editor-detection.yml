name: TEMP fix V92 editor detection

on:
  push:
    branches:
      - audit/v92-team4-preview-parity-20260820

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v92-team4-preview-parity-20260820
      - name: Corrigir detecção estrutural do editor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const corePath = 'public/preview-editor-v91-core.js';
          let core = fs.readFileSync(corePath, 'utf8');
          const oldCode = `  const isEditor = () => location.pathname.startsWith('/admin') && [...document.querySelectorAll('h1,h2')]\n    .some((node) => normalize(node.textContent) === 'editar catalogo');`;
          const newCode = `  const isEditor = () => {\n    if (!location.pathname.startsWith('/admin')) return false;\n    const titleMatch = [...document.querySelectorAll('h1,h2')].some((node) => normalize(node.textContent) === 'editar catalogo');\n    if (titleMatch) return true;\n    const canvasNode = document.querySelector('[data-node-id]');\n    if (!(canvasNode instanceof HTMLElement)) return false;\n    const editorChrome = document.querySelector('[data-asteryon-editor-sidebar], [data-asteryon-mobile-toolbar]')\n      || [...document.querySelectorAll('button')].find((button) => ['elementos','modelos','gestao do catalogo','publicar','salvar'].includes(normalize(button.textContent)));\n    return !!editorChrome;\n  };`;
          if (!core.includes(oldCode)) throw new Error('Detecção antiga do editor não encontrada.');
          core = core.replace(oldCode, newCode);
          fs.writeFileSync(corePath, core);

          const qaPath = 'scripts/qa-preview-editor-v92-team4.mjs';
          let qa = fs.readFileSync(qaPath, 'utf8');
          qa = qa.replace(
            `const [html, capture, team4, e2e] = await Promise.all([\n  readFile('public/index.html', 'utf8'),\n  readFile('public/preview-editor-v91-capture.js', 'utf8'),\n  readFile('public/preview-editor-v92-team4.js', 'utf8'),\n  readFile('tests/e2e/preview-editor-team4-v92.spec.mjs', 'utf8'),\n]);`,
            `const [html, core, capture, team4, e2e] = await Promise.all([\n  readFile('public/index.html', 'utf8'),\n  readFile('public/preview-editor-v91-core.js', 'utf8'),\n  readFile('public/preview-editor-v91-capture.js', 'utf8'),\n  readFile('public/preview-editor-v92-team4.js', 'utf8'),\n  readFile('tests/e2e/preview-editor-team4-v92.spec.mjs', 'utf8'),\n]);`
          );
          const anchor = `assert.ok(html.indexOf('/preview-editor-v92-team4.js') < html.indexOf('/assets/index-V60Excel.js'), 'Equipe 4 precisa estar ativa antes do bundle/editor.');\n`;
          const addition = `\nassert.match(core, /document\\.querySelector\\('\\[data-node-id\\]'\\)/, 'Detecção do Editor precisa reconhecer o canvas editável real.');\nassert.match(core, /data-asteryon-editor-sidebar/, 'Detecção estrutural deve confirmar chrome do editor, não apenas um título.');\nassert.doesNotMatch(core, /const isEditor = \\(\\) => location\\.pathname\\.startsWith\\('\\/admin'\\) &&/, 'V92 não pode voltar a depender exclusivamente do heading Editar catálogo.');\n`;
          if (!qa.includes(addition.trim())) qa = qa.replace(anchor, anchor + addition);
          fs.writeFileSync(qaPath, qa);
          NODE
      - name: Validar sintaxe
        run: |
          node --check public/preview-editor-v91-core.js
          node --check scripts/qa-preview-editor-v92-team4.mjs
      - name: Gravar correção
        run: |
          if git diff --quiet -- public/preview-editor-v91-core.js scripts/qa-preview-editor-v92-team4.mjs; then
            echo "Detecção já corrigida."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/preview-editor-v91-core.js scripts/qa-preview-editor-v92-team4.mjs
          git commit -m "fix: detect editor by real canvas structure [skip ci]"
          git push origin HEAD:audit/v92-team4-preview-parity-20260820
