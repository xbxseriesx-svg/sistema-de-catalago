name: Enterprise — 6 Equipes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-six-teams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team0:
    name: Equipe 0 — Arquitetura e Governança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências sem scripts de terceiros
        run: npm ci --ignore-scripts
      - name: Validar lockfile determinístico do frontend
        run: test -s frontend/package-lock.json
      - name: Validar candidato final sem legado físico
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs

  team1:
    name: Equipe 1 — Build e Desenvolvimento
    needs: team0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Executar regressão oficial completa do Worker/SPA
        run: npm test
      - name: Revalidar frontend SPA oficial isoladamente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output

  team2:
    name: Equipe 2 — Auditoria Técnica e Segurança
    needs: team1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar release Enterprise oficial
        run: npm run prepare:release
      - name: TypeScript e dry-run oficial
        run: |
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-enterprise-audit
          node scripts/prepare-worker-qa.mjs
      - name: Revalidar arquitetura e contratos de segurança
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
          node scripts/qa-auth-refresh.mjs
          node scripts/qa-auth-account.mjs
          node scripts/qa-remote-image-ssrf.mjs
          node scripts/qa-product-images.mjs
      - name: Auditoria de dependências do Worker
        run: npm audit --audit-level=high
      - name: Auditar frontend SPA oficial sem scripts de terceiros
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm audit --audit-level=high
      - name: Checkout isolado do baseline de rollback
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: _rollback-v94
      - name: Provar rollback do SHA-base sem publicar
        working-directory: _rollback-v94
        run: |
          npm ci --ignore-scripts
          npm run prepare:bundle
          npx wrangler deploy --dry-run --outdir ../.wrangler-base-rollback-audit

  team3:
    name: Equipe 3 — Homologação Funcional e UX
    needs: team2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar projeto
        run: npm ci --ignore-scripts
      - name: Preparar release Enterprise oficial
        run: npm run prepare:release
      - name: Instalar Playwright/Chromium para QA
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Executar homologação desktop e mobile contra SPA oficial
        run: npx playwright test --config=playwright.config.mjs
      - name: Evidências da Equipe 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe3-evidencias
          path: |
            test-results/
            playwright-report/
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 14

  team4:
    name: Equipe 4 — Auditoria Mestra Independente
    needs: team3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar projeto em runner independente
        run: npm ci --ignore-scripts
      - name: Preparar e compilar novamente o release oficial
        run: |
          npm run prepare:release
          npx wrangler deploy --dry-run --outdir .wrangler-enterprise-team4
      - name: Reconstruir frontend SPA oficial em runner independente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Instalar Chromium independente
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Contratos de segurança antes dos E2E independentes
        run: |
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
      - name: Repetir regressões críticas e importação no SPA oficial
        run: |
          npx playwright test tests/e2e/editor-functional-regressions.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/import-products-enterprise.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/preview-editor-filled-source.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/preview-editor-independent.spec.mjs --project=chromium-desktop --project=chromium-mobile
      - name: Evidências da Equipe 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe4-evidencias
          path: |
            test-results/
            playwright-report/
            .wrangler-enterprise-team4/
            frontend/dist/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  team5:
    name: Equipe 5 — DevOps e Release Readiness
    needs: team4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar exatamente os assets de release Enterprise
        run: npm run prepare:release
      - name: Oficial — validar Worker e SPA Enterprise sem publicar
        run: npx wrangler deploy --dry-run --outdir .wrangler-enterprise-dry-run
      - name: Revalidar frontend SPA oficial ativado no release
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Revalidar metadados, segurança e limpeza final
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs
          node scripts/qa-supabase-baseline.mjs
      - name: Checkout isolado do baseline de rollback
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: _rollback-v94
      - name: Release readiness — provar rollback do SHA-base sem publicar
        working-directory: _rollback-v94
        run: |
          npm ci --ignore-scripts
          npm run prepare:bundle
          npx wrangler deploy --dry-run --outdir ../.wrangler-base-rollback
      - name: Artefatos de dry-run e frontend SPA oficial para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe5-release-candidate
          path: |
            .wrangler-base-rollback/
            .wrangler-enterprise-dry-run/
            frontend/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
