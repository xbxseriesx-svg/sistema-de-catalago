name: Enterprise — 6 Equipes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-six-teams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team0:
    name: Equipe 0 — Arquitetura e Governança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências sem scripts de terceiros
        run: npm ci --ignore-scripts
      - name: Validar lockfile determinístico do frontend
        run: test -s frontend/package-lock.json
      - name: Validar invariantes da transição Enterprise
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs

  team1:
    name: Equipe 1 — Build e Desenvolvimento
    needs: team0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar arquitetura modular em reconstrução
        run: node scripts/qa-enterprise-backend.mjs
      - name: Compilar e executar regressão automatizada com Enterprise oficial
        run: npm test
      - name: Revalidar frontend SPA oficial isoladamente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output

  team2:
    name: Equipe 2 — Auditoria Técnica e Segurança
    needs: team1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar release Enterprise oficial
        run: npm run prepare:release
      - name: TypeScript
        run: npm run check
      - name: Preparar rollback legado explicitamente
        run: npm run prepare:rollback
      - name: Gerar rollback V81 no caminho dos testes históricos
        run: npx wrangler deploy --dry-run --config wrangler.legacy-rollback.jsonc --outdir .wrangler-legacy-rollback-audit
      - name: Compilar Worker e SPA Enterprise oficiais no Wrangler
        run: npx wrangler deploy --dry-run --outdir .wrangler-enterprise-audit
      - name: Revalidar independência do backend novo
        run: node scripts/qa-enterprise-backend.mjs
      - name: Validar contratos de segurança Enterprise e IA
        run: |
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
      - name: Segurança histórica, SSRF e isolamento por tenant no Enterprise oficial
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          node scripts/prepare-worker-qa.mjs
          node scripts/qa-security-v89.mjs
          node scripts/qa-remote-image-ssrf-v89.mjs
          node scripts/qa-tenant-isolation-v89.mjs
      - name: Auditoria de dependências do Worker
        run: npm audit --audit-level=high
      - name: Auditar frontend SPA oficial sem scripts de terceiros
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm audit --audit-level=high

  team3:
    name: Equipe 3 — Homologação Funcional e UX
    needs: team2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar projeto
        run: npm ci --ignore-scripts
      - name: Preparar release Enterprise oficial
        run: npm run prepare:release
      - name: Instalar Playwright/Chromium para QA
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Executar homologação desktop e mobile contra SPA oficial
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile
      - name: Evidências da Equipe 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe3-evidencias
          path: |
            test-results/
            playwright-report/
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 14

  team4:
    name: Equipe 4 — Auditoria Mestra Independente
    needs: team3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar projeto em runner independente
        run: npm ci --ignore-scripts
      - name: Preparar release oficial do mesmo commit
        run: npm run prepare:release
      - name: Compilar novamente Worker e SPA Enterprise oficiais
        run: npx wrangler deploy --dry-run --outdir .wrangler-enterprise-team4
      - name: Reconstruir frontend SPA oficial em runner independente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Instalar Chromium independente
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Contratos de segurança antes dos E2E independentes
        run: |
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
      - name: Repetir regressões críticas e stress do Editor no SPA oficial
        run: |
          npx playwright test tests/e2e/editor-functional-regressions.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/preview-editor-v93-filled-source.spec.mjs --project=chromium-desktop --project=chromium-mobile
      - name: Evidências da Equipe 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe4-evidencias
          path: |
            test-results/
            playwright-report/
            .wrangler-enterprise-team4/
            frontend/dist/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  team5:
    name: Equipe 5 — DevOps e Release Readiness
    needs: team4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar exatamente os assets de release Enterprise
        run: npm run prepare:release
      - name: Preparar rollback legado explicitamente
        run: npm run prepare:rollback
      - name: Rollback — validar Worker V81 e public legado sem publicar
        run: npx wrangler deploy --dry-run --config wrangler.legacy-rollback.jsonc --outdir .wrangler-legacy-rollback
      - name: Oficial — validar Worker e SPA Enterprise sem publicar
        run: npx wrangler deploy --dry-run --outdir .wrangler-enterprise-dry-run
      - name: Revalidar frontend SPA oficial ativado no release
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Revalidar metadados, segurança e limpeza transitória
        run: |
          node scripts/qa-version-v94.mjs
          node scripts/qa-cleanup-v89.mjs
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs
      - name: Artefatos de dry-run e frontend SPA oficial para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe5-release-candidate
          path: |
            .wrangler-legacy-rollback/
            .wrangler-enterprise-dry-run/
            frontend/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
