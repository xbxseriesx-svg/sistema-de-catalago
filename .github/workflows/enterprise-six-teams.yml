name: Enterprise — 6 Equipes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFIED_V94_ROLLBACK_SHA: 6b07df6c8e07ff50c20dc32eb96d2f0a4ff0e657

concurrency:
  group: enterprise-six-teams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team0:
    name: Equipe 0 — Arquitetura e Governança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar dependências sem scripts de terceiros
        run: npm ci --ignore-scripts
      - name: Validar lockfile determinístico do frontend
        run: test -s frontend/package-lock.json
      - name: Validar topologia de produção compatível com V94 e Worker modular
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs

  team1:
    name: Equipe 1 — Build e Desenvolvimento
    needs: team0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Executar regressão oficial completa do Worker e fontes
        run: npm test
      - name: Revalidar frontend Enterprise de fonte isoladamente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output

  team2:
    name: Equipe 2 — Auditoria Técnica e Segurança
    needs: team1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar release e fonte Enterprise
        run: npm run prepare:release
      - name: TypeScript e dry-run da topologia realmente servida
        run: |
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          node scripts/prepare-worker-qa.mjs
      - name: Revalidar arquitetura e contratos de segurança
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
          node scripts/qa-auth-refresh.mjs
          node scripts/qa-auth-account.mjs
          node scripts/qa-remote-image-ssrf.mjs
          node scripts/qa-product-images.mjs
      - name: Auditoria de dependências do Worker
        run: npm audit --audit-level=high
      - name: Auditar frontend Enterprise de fonte sem scripts de terceiros
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm audit --audit-level=high
      - name: Checkout isolado do último production V94 verificado
        uses: actions/checkout@v4
        with:
          ref: 6b07df6c8e07ff50c20dc32eb96d2f0a4ff0e657
          path: _rollback-v94
      - name: Provar rollback V94 sem publicar
        working-directory: _rollback-v94
        run: |
          npm ci --ignore-scripts
          npm run prepare:bundle
          npx wrangler deploy --dry-run --outdir ../.wrangler-base-rollback-audit

  team3:
    name: Equipe 3 — Homologação Funcional e UX
    needs: team2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar projeto
        run: npm ci --ignore-scripts
      - name: Preparar fontes Enterprise
        run: npm run prepare:release
      - name: Instalar Playwright/Chromium para QA
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Homologar fonte Enterprise desktop/mobile
        run: npx playwright test --config=playwright.config.mjs
      - name: Homologar UI V94 realmente servida em produção desktop/mobile
        run: npx playwright test --config=playwright.production-compat.config.mjs
      - name: Evidências da Equipe 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe3-evidencias
          path: |
            test-results/
            playwright-report/
            frontend/dist/
            public/index.html
          if-no-files-found: ignore
          retention-days: 14

  team4:
    name: Equipe 4 — Auditoria Mestra Independente
    needs: team3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar projeto em runner independente
        run: npm ci --ignore-scripts
      - name: Preparar e compilar novamente a topologia oficial
        run: |
          npm run prepare:release
          npx wrangler deploy --dry-run --outdir .wrangler-enterprise-team4
      - name: Reconstruir frontend Enterprise de fonte em runner independente
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Instalar Chromium independente
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: Contratos de segurança antes dos E2E independentes
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-ai.mjs
      - name: Repetir regressões críticas da fonte Enterprise
        run: |
          npx playwright test tests/e2e/editor-functional-regressions.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/import-products-enterprise.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/preview-editor-filled-source.spec.mjs --project=chromium-desktop --project=chromium-mobile
          npx playwright test tests/e2e/preview-editor-independent.spec.mjs --project=chromium-desktop --project=chromium-mobile
      - name: Repetir UI de produção V94 de forma independente
        run: npx playwright test --config=playwright.production-compat.config.mjs
      - name: Evidências da Equipe 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe4-evidencias
          path: |
            test-results/
            playwright-report/
            .wrangler-enterprise-team4/
            frontend/dist/
            public/index.html
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  team5:
    name: Equipe 5 — DevOps e Release Readiness
    needs: team4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Preparar fontes e assets de release
        run: npm run prepare:release
      - name: Oficial — validar Worker modular + public V94 sem publicar
        run: npx wrangler deploy --dry-run --outdir .wrangler-enterprise-dry-run
      - name: Revalidar fonte Enterprise preservada
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run qa:enterprise
          npm run typecheck
          npm run build
          test -f dist/index.html
          test ! -d .output
      - name: Revalidar metadados, segurança e topologia de produção
        run: |
          node scripts/qa-enterprise-transition.mjs
          node scripts/qa-enterprise-backend.mjs
          node scripts/qa-enterprise-security-contracts.mjs
          node scripts/qa-enterprise-frontend-source.mjs
          node scripts/qa-enterprise-ai.mjs
          node scripts/qa-supabase-baseline.mjs
      - name: Checkout isolado do último production V94 verificado
        uses: actions/checkout@v4
        with:
          ref: 6b07df6c8e07ff50c20dc32eb96d2f0a4ff0e657
          path: _rollback-v94
      - name: Release readiness — provar rollback V94 sem publicar
        working-directory: _rollback-v94
        run: |
          npm ci --ignore-scripts
          npm run prepare:bundle
          npx wrangler deploy --dry-run --outdir ../.wrangler-base-rollback
      - name: Artefatos de dry-run e UIs para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-equipe5-release-candidate
          path: |
            .wrangler-base-rollback/
            .wrangler-enterprise-dry-run/
            frontend/dist/
            public/index.html
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
