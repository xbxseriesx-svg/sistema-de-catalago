name: QA Funcional Completo V5

on:
  push:
    branches: [fix/full-functional-audit-v5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-functional:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperar fonte exata do Editor v2.1
        shell: pwsh
        run: ./cloud-overlay/scripts/recover-v21.ps1

      - name: Aplicar camada de produção existente
        shell: pwsh
        run: |
          Copy-Item cloud-overlay/package.json app/package.json -Force
          Copy-Item cloud-overlay/src/App.tsx app/src/App.tsx -Force
          New-Item -ItemType Directory -Force app/src/cloud, app/src/public, app/worker, app/migrations, app/scripts | Out-Null
          Copy-Item cloud-overlay/src/cloud/* app/src/cloud/ -Force
          Copy-Item cloud-overlay/src/public/* app/src/public/ -Force
          Copy-Item cloud-overlay/src/editor/TemplatesPanel.tsx app/src/editor/TemplatesPanel.tsx -Force
          Copy-Item cloud-overlay/src/catalog/store.tsx app/src/catalog/store.tsx -Force
          Copy-Item cloud-overlay/worker/* app/worker/ -Force
          Copy-Item cloud-overlay/migrations/* app/migrations/ -Force
          Copy-Item cloud-overlay/scripts/make-wrangler.mjs app/scripts/make-wrangler.mjs -Force
          Remove-Item app/src/cloud/ActionBridge.tsx -Force -ErrorAction SilentlyContinue
          Remove-Item app/package-lock.json -Force -ErrorAction SilentlyContinue

          $workerUtilPath = 'app/worker/util.ts'
          $workerUtil = Get-Content $workerUtilPath -Raw
          $workerUtil = $workerUtil.Replace('iterations=210000', 'iterations=100000')
          if ($workerUtil.Contains('iterations=210000')) { throw 'Falha ao aplicar limite PBKDF2 do Cloudflare' }
          Set-Content $workerUtilPath $workerUtil -Encoding UTF8

          foreach ($patchPath in @('cloud-overlay/patches/saas-store.patch','cloud-overlay/patches/saas-toolbar.patch')) {
            $patchText = [IO.File]::ReadAllText($patchPath).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($patchPath, $patchText, [Text.UTF8Encoding]::new($false))
          }
          git apply --directory=app --recount --whitespace=nowarn cloud-overlay/patches/saas-store.patch
          git apply --directory=app --recount --whitespace=nowarn cloud-overlay/patches/saas-toolbar.patch

          $canvasPath = 'app/src/editor/Canvas.tsx'
          $canvas = Get-Content $canvasPath -Raw
          $canvas = $canvas.Replace("const { state, dispatch, getNode } = useEditor();", "const { state, dispatch, getNode, saveDraft } = useEditor();")
          $canvas = $canvas.Replace("dispatch({ type: 'SAVE_DRAFT' });", "void saveDraft();")
          $canvas = $canvas.Replace("state.device, dispatch, getNode]);", "state.device, dispatch, getNode, saveDraft]);")
          Set-Content $canvasPath $canvas -Encoding UTF8

          $historyPath = 'app/src/editor/HistoryPanel.tsx'
          $history = Get-Content $historyPath -Raw
          $history = $history.Replace("const { state, dispatch } = useEditor();", "const { state, dispatch, createSnapshot } = useEditor();")
          $history = $history.Replace("onClick={() => dispatch({ type: 'CREATE_SNAPSHOT', label: 'Ponto manual' })}", "onClick={() => void createSnapshot('Ponto manual')}")
          Set-Content $historyPath $history -Encoding UTF8

      - name: Aplicar correções funcionais V5
        shell: pwsh
        run: ./cloud-overlay/scripts/apply-functional-v5.ps1

      - name: Instalar dependências
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript completo
        working-directory: app
        run: npm run typecheck

      - name: Build editor e portal público
        working-directory: app
        run: npm run build

      - name: Bundle do Worker
        working-directory: app
        run: npx --yes esbuild worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=worker-qa-v5.mjs

      - name: Auditoria funcional estática
        shell: pwsh
        run: |
          $required = @(
            'app/src/App.tsx',
            'app/src/editor/Toolbar.tsx',
            'app/src/editor/Canvas.tsx',
            'app/src/editor/PropertiesPanel.tsx',
            'app/src/editor/store.tsx',
            'app/src/cloud/ProductsPanel.tsx',
            'app/src/cloud/BrandsPanel.tsx',
            'app/src/cloud/MarketingPanel.tsx',
            'app/src/cloud/OffersPanel.tsx',
            'app/src/cloud/HierarchyPanel.tsx',
            'app/src/cloud/ButtonActionEditor.tsx',
            'app/src/public/PublicSiteV3.tsx',
            'app/src/public/PublicCatalogV3.tsx',
            'app/src/public/PublicMarketingV3.tsx',
            'app/worker/media.ts',
            'app/worker/management.ts'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Arquivo obrigatório ausente: $file" } }

          if (-not (Select-String app/src/editor/Toolbar.tsx -SimpleMatch '1080p / Full HD' -Quiet)) { throw 'Resolução 1080p ausente' }
          if (-not (Select-String app/src/editor/Toolbar.tsx -SimpleMatch '2K / QHD' -Quiet)) { throw 'Resolução 2K ausente' }
          if (-not (Select-String app/src/editor/Toolbar.tsx -SimpleMatch '4K / UHD' -Quiet)) { throw 'Resolução 4K ausente' }
          if (-not (Select-String app/src/editor/Canvas.tsx -SimpleMatch "pageRect.width >= 3840 ? 2160" -Quiet)) { throw 'Dobra 4K incorreta' }
          if (-not (Select-String app/src/editor/Canvas.tsx -SimpleMatch "pageRect.width >= 2560 ? 1440" -Quiet)) { throw 'Dobra 2K incorreta' }
          if (-not (Select-String app/src/editor/PropertiesPanel.tsx -SimpleMatch 'Salvar ajuste atual em todos os modos' -Quiet)) { throw 'Salvar em todos os modos ausente' }
          if (-not (Select-String app/src/editor/PropertiesPanel.tsx -SimpleMatch "if (key === 'desktop')" -Quiet)) { throw 'Correção do ajuste Desktop ausente' }
          if (-not (Select-String app/src/editor/store.tsx -SimpleMatch 'persistCloudDraft' -Quiet)) { throw 'Persistência serializada D1 ausente' }
          if (-not (Select-String app/src/editor/store.tsx -SimpleMatch 'lastPersistedNodesRef' -Quiet)) { throw 'Controle de autosave D1 ausente' }
          if (-not (Select-String app/src/editor/store.tsx -SimpleMatch '850' -Quiet)) { throw 'Autosave do editor ausente' }
          if (-not (Select-String app/src/App.tsx -SimpleMatch 'Marketing visível no modo de edição' -Quiet)) { throw 'Marketing não aparece no editor' }
          if (-not (Select-String app/src/public/PublicMarketingV3.tsx -SimpleMatch 'object-contain' -Quiet)) { throw 'Mídia sem ajuste contain' }
          if (Select-String app/src/public/PublicMarketingV3.tsx -SimpleMatch 'object-cover' -Quiet) { throw 'Ainda existe zoom/corte object-cover no Marketing' }
          if (-not (Select-String app/src/public/PublicSiteV3.tsx -SimpleMatch 'getResponsiveRect(live,device)' -Quiet)) { throw 'Site público não aplica responsividade dos elementos' }
          if (-not (Select-String app/src/public/PublicSiteV3.tsx -SimpleMatch "viewport<=767?'mobile':viewport<=1100?'tablet':'desktop'" -Quiet)) { throw 'Detecção responsiva pública ausente' }
          if (-not (Select-String app/src/cloud/MarketingPanel.tsx -SimpleMatch 'D1 OK' -Quiet)) { throw 'Confirmação real de Marketing no D1 ausente' }
          if (-not (Select-String app/src/cloud/MarketingPanel.tsx -SimpleMatch 'PublicMarketingV3' -Quiet)) { throw 'Prévia real de Marketing ausente' }
          if (-not (Select-String app/worker/media.ts -SimpleMatch 'sha256' -Quiet)) { throw 'Deduplicação de mídia ausente' }
          if (-not (Select-String app/src/cloud/ProductsPanel.tsx -SimpleMatch 'Departamento → Seção → Categoria → Produto' -Quiet)) { throw 'Gestão de produtos/hierarquia ausente' }
          if (-not (Select-String app/src/cloud/ButtonActionEditor.tsx -SimpleMatch 'Informações do produto' -Quiet)) { throw 'Ações de botão/produto ausentes' }

          Write-Host 'Auditoria funcional V5 concluída sem falhas.'

      - name: Procurar regressões e placeholders perigosos
        shell: pwsh
        run: |
          $patterns = @('TODO: implementar','FIXME:','throw new Error("Not implemented','alert("TODO')
          foreach ($pattern in $patterns) {
            $hits = Get-ChildItem app/src,app/worker -Recurse -File -Include *.ts,*.tsx | Select-String -SimpleMatch $pattern
            if ($hits) {
              $hits | ForEach-Object { Write-Host $_.Path ':' $_.LineNumber $_.Line }
              throw "Placeholder funcional encontrado: $pattern"
            }
          }
          Write-Host 'Nenhum placeholder funcional bloqueante encontrado.'
