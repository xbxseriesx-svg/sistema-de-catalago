name: TEMP V92 materialize approved preview bridge

on:
  push:
    branches:
      - audit/v92-team4-preview-parity-20260820

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v92-team4-preview-parity-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ligar captura aprovada ao handler React e reforçar QA
        run: |
          node <<'NODE'
          const fs = require('fs');

          const capturePath = 'public/preview-editor-v91-capture.js';
          let capture = fs.readFileSync(capturePath, 'utf8');
          if (!capture.includes('__ASTERYON_PREVIEW_EDITOR_APPLY_V92__')) {
            const anchor = '      report.templateReferencesUpdated = refs;\n';
            if (!capture.includes(anchor)) throw new Error('Âncora do relatório da captura não encontrada.');
            const bridge = `      report.templateReferencesUpdated = refs;\n      window.__ASTERYON_PREVIEW_EDITOR_APPLY_V92__ = {\n        modelName: result.modelName,\n        nodes: result.nodes,\n        team3Ok: report.ok === true,\n        team4Ok: team4Request.team4Report?.ok === true,\n        createdAt: Date.now(),\n      };\n`;
            capture = capture.replace(anchor, bridge);
            fs.writeFileSync(capturePath, capture);
          }

          const e2ePath = 'tests/e2e/preview-editor-team4-v92.spec.mjs';
          let e2e = fs.readFileSync(e2ePath, 'utf8');
          e2e = e2e.replace(
            `  await expect(page.locator('[data-node-id]').filter({ hasText: 'MODELO OFICIAL QA' }).first()).toBeVisible({ timeout: 12_000 });`,
            `  await expect(page.locator('[data-node-id]').filter({ hasText: 'Marca do catálogo' }).first()).toBeVisible({ timeout: 12_000 });\n  await expect(page.locator('[data-node-id]').filter({ hasText: 'Marca QA' }).first()).toBeVisible({ timeout: 12_000 });`
          );
          fs.writeFileSync(e2ePath, e2e);

          const qaPath = 'scripts/qa-preview-editor-v92-team4.mjs';
          let qa = fs.readFileSync(qaPath, 'utf8');
          if (!qa.includes("readFile('public/assets/index-V60Excel.js'")) {
            qa = qa.replace(
              `const [html, core, capture, team4, e2e] = await Promise.all([\n  readFile('public/index.html', 'utf8'),`,
              `const [html, bundle, core, capture, team4, e2e] = await Promise.all([\n  readFile('public/index.html', 'utf8'),\n  readFile('public/assets/index-V60Excel.js', 'utf8'),`
            );
          }
          const qaAnchor = `assert.ok(html.indexOf('/preview-editor-v92-team4.js') < html.indexOf('/assets/index-V60Excel.js'), 'Equipe 4 precisa estar ativa antes do bundle/editor.');\n`;
          if (!qa.includes('ASTER_V92_PREVIEW_APPLY_BRIDGE')) {
            qa = qa.replace(qaAnchor, qaAnchor + `\nassert.match(bundle, /ASTER_V92_PREVIEW_APPLY_BRIDGE/, 'Bundle publicado precisa conter a ponte V92 para a árvore aprovada.');\nassert.match(bundle, /__ASTERYON_PREVIEW_EDITOR_APPLY_V92__/, 'Handler React precisa consumir o payload one-shot aprovado do Preview.');\nassert.match(bundle, /V92A\.modelName===b/, 'Payload V92 só pode ser consumido pelo mesmo modelo que originou o Preview.');\nassert.match(bundle, /V92A\.team3Ok===!0&&V92A\.team4Ok===!0/, 'Handler só pode consumir árvore com dupla aprovação prévia.');\nassert.match(capture, /__ASTERYON_PREVIEW_EDITOR_APPLY_V92__/, 'Captura precisa entregar o payload aprovado ao handler real.');\nassert.match(capture, /team3Ok: report\.ok === true/, 'Payload deve carregar aprovação da Equipe 3.');\nassert.match(capture, /team4Ok: team4Request\.team4Report\?\.ok === true/, 'Payload deve carregar aprovação da Equipe 4.');\n`);
          }
          qa = qa.replace(
            `for (const file of ['public/preview-editor-v91-capture.js', 'public/preview-editor-v92-team4.js', 'scripts/qa-preview-editor-v92-team4.mjs', 'tests/e2e/preview-editor-team4-v92.spec.mjs']) {`,
            `for (const file of ['public/preview-editor-v91-capture.js', 'public/preview-editor-v92-team4.js', 'scripts/patch-preview-apply-v92.mjs', 'scripts/qa-preview-editor-v92-team4.mjs', 'tests/e2e/preview-editor-team4-v92.spec.mjs']) {`
          );
          fs.writeFileSync(qaPath, qa);
          NODE
      - name: Materializar bundle exatamente como será testado/publicado
        run: node scripts/patch-preview-apply-v92.mjs
      - name: Validar sintaxe e ponte
        run: |
          node --check public/preview-editor-v91-capture.js
          node --check scripts/patch-preview-apply-v92.mjs
          node --check scripts/qa-preview-editor-v92-team4.mjs
          node --check tests/e2e/preview-editor-team4-v92.spec.mjs
          grep -q 'ASTER_V92_PREVIEW_APPLY_BRIDGE' public/assets/index-V60Excel.js
      - name: Gravar materialização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/preview-editor-v91-capture.js public/assets/index-V60Excel.js scripts/qa-preview-editor-v92-team4.mjs tests/e2e/preview-editor-team4-v92.spec.mjs
          if git diff --cached --quiet; then
            echo 'Nada a materializar.'
            exit 0
          fi
          git commit -m "fix: apply Team 3 and Team 4 approved preview tree [skip ci]"
          git push origin HEAD:audit/v92-team4-preview-parity-20260820
