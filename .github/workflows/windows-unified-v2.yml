name: Windows 11 Unified v2 Installer

on:
  push:
    branches:
      - build/windows11-unified-v2
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct unified source
        shell: pwsh
        run: |
          $parts = Get-ChildItem unified/source.part*.b64 | Sort-Object Name
          if ($parts.Count -ne 17) { throw "Expected 17 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$PWD\unified-source.zip", $bytes)
          $hash = (Get-FileHash "$PWD\unified-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "957266788fbfb5d8ec52052eee29c74282f7c4a28ae66268f93ffd2a8f223e0b") {
            throw "Unified source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force app | Out-Null
          Expand-Archive -Path "$PWD\unified-source.zip" -DestinationPath "$PWD\app" -Force
          Write-Host "Unified source reconstructed and verified: $hash"

      - name: Prepare Electron desktop wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app\desktop | Out-Null
          @'
          const { app, BrowserWindow, shell } = require('electron');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          let server;

          function contentType(file) {
            const ext = path.extname(file).toLowerCase();
            return ({
              '.html': 'text/html; charset=utf-8',
              '.js': 'text/javascript; charset=utf-8',
              '.css': 'text/css; charset=utf-8',
              '.json': 'application/json; charset=utf-8',
              '.svg': 'image/svg+xml',
              '.png': 'image/png',
              '.jpg': 'image/jpeg',
              '.jpeg': 'image/jpeg',
              '.webp': 'image/webp',
              '.ico': 'image/x-icon',
              '.woff': 'font/woff',
              '.woff2': 'font/woff2'
            })[ext] || 'application/octet-stream';
          }

          function startServer() {
            const root = path.resolve(__dirname, '..', 'dist');
            return new Promise((resolve, reject) => {
              server = http.createServer((req, res) => {
                try {
                  const rawPath = decodeURIComponent((req.url || '/').split('?')[0]);
                  const safePath = rawPath.replace(/^\/+/, '');
                  let file = path.resolve(root, safePath || 'index.html');
                  if (!file.startsWith(root)) {
                    res.writeHead(403);
                    res.end('Forbidden');
                    return;
                  }
                  if (!fs.existsSync(file) || fs.statSync(file).isDirectory()) {
                    file = path.join(root, 'index.html');
                  }
                  res.writeHead(200, {
                    'Content-Type': contentType(file),
                    'Cache-Control': 'no-cache',
                    'X-Content-Type-Options': 'nosniff'
                  });
                  fs.createReadStream(file).pipe(res);
                } catch (error) {
                  res.writeHead(500);
                  res.end('Internal error');
                }
              });
              server.on('error', reject);
              server.listen(0, '127.0.0.1', () => {
                const address = server.address();
                resolve(`http://127.0.0.1:${address.port}/`);
              });
            });
          }

          async function createWindow() {
            const localUrl = await startServer();
            const win = new BrowserWindow({
              width: 1600,
              height: 980,
              minWidth: 1100,
              minHeight: 700,
              backgroundColor: '#0b1220',
              autoHideMenuBar: true,
              show: false,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.once('ready-to-show', () => win.show());
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (event, target) => {
              if (!target.startsWith(localUrl)) {
                event.preventDefault();
                if (/^https?:/i.test(target)) shell.openExternal(target);
              }
            });
            await win.loadURL(localUrl);
          }

          app.whenReady().then(createWindow);
          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          app.on('before-quit', () => {
            try { server?.close(); } catch {}
          });
          '@ | Set-Content app\desktop\main.cjs -Encoding UTF8

          @'
          const fs = require('fs');
          const file = 'app/package.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          p.version = '2.0.0-test';
          p.main = 'desktop/main.cjs';
          p.scripts = { ...(p.scripts || {}), 'dist:win': 'npm run build && electron-builder --win nsis --x64' };
          p.devDependencies = { ...(p.devDependencies || {}), electron: '43.2.0', 'electron-builder': '^26.0.0' };
          p.build = {
            appId: 'br.com.asteryon.catalogo.unificado.test',
            productName: 'ASTERYON Catálogo Digital Unificado TESTE',
            copyright: 'ASTERYON',
            asar: true,
            files: ['dist/**/*', 'desktop/**/*', 'package.json'],
            directories: { output: 'release' },
            win: { target: [{ target: 'nsis', arch: ['x64'] }] },
            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true,
              shortcutName: 'ASTERYON Catálogo Digital Unificado TESTE',
              uninstallDisplayName: 'ASTERYON Catálogo Digital Unificado TESTE',
              deleteAppDataOnUninstall: false,
              runAfterFinish: true
            }
          };
          fs.writeFileSync(file, JSON.stringify(p, null, 2));
          '@ | Set-Content prepare-package.cjs -Encoding UTF8
          node prepare-package.cjs

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build web application
        working-directory: app
        run: npm run build

      - name: Build Windows installer
        working-directory: app
        run: npx electron-builder --win nsis --x64

      - name: Create Windows 11 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          $exe = Get-ChildItem app\release\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows installer was not generated." }
          Copy-Item $exe.FullName package\ASTERYON_Catalogo_Unificado_Setup_Windows11_TESTE_2.0.0-test.exe
          @'
          ASTERYON CATÁLOGO DIGITAL UNIFICADO v2.0 TESTE
          Windows 11 x64

          Base unificada:
          - Bolt: interface visual e experiência principal do editor
          - Canvas Studio: motor de edição, camadas e ferramentas criativas
          - Lovable: catálogo, produtos e regras empresariais

          Esta é uma versão de homologação local.
          O instalador foi compilado em runner Windows x64 e não possui assinatura digital comercial.
          O Windows SmartScreen pode mostrar aviso por o executável não ser assinado.

          Testes principais sugeridos:
          1. Abrir página em branco.
          2. Inserir Texto, Imagem, Botão e Produto.
          3. Mover e redimensionar livremente os objetos.
          4. Testar sobreposição e painel Camadas.
          5. Testar agrupar/desagrupar e seleção múltipla.
          6. Testar Desktop, Tablet e Mobile.
          7. Validar Produto/Vitrine como elementos editáveis.
          '@ | Set-Content package\LEIA-ME_ASTERYON_Unificado_Windows11_TESTE.txt -Encoding UTF8
          Compress-Archive -Path package\* -DestinationPath ASTERYON_Catalogo_Unificado_Windows11_TESTE_Completo.zip -Force
          Get-FileHash package\ASTERYON_Catalogo_Unificado_Setup_Windows11_TESTE_2.0.0-test.exe -Algorithm SHA256

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v2.0-Unified-Bolt-Canvas-Lovable
          path: |
            package/*.exe
            package/*.txt
            ASTERYON_Catalogo_Unificado_Windows11_TESTE_Completo.zip
          if-no-files-found: error
