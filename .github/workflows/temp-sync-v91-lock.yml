name: TEMP sync V91 lockfile

on:
  push:
    branches:
      - audit/v91-quality-gate-20260820

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v91-quality-gate-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sincronizar metadados npm da release V91
        run: npm version 2.1.91 --no-git-tag-version --allow-same-version
      - name: Gravar somente package.json e package-lock.json
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile já sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync npm lock metadata to 2.1.91 [skip ci]"
          git push origin HEAD:audit/v91-quality-gate-20260820
