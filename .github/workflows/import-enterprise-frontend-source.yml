name: Enterprise — Importar fonte React recuperada

on:
  push:
    branches:
      - enterprise/6-equipes-consolidacao
    paths:
      - '.enterprise-frontend-payload/**'
      - 'scripts/import-enterprise-frontend-source.sh'
      - '.github/workflows/import-enterprise-frontend-source.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.enterprise-frontend-payload/**'
      - 'scripts/import-enterprise-frontend-source.sh'
      - '.github/workflows/import-enterprise-frontend-source.yml'

permissions:
  contents: write

concurrency:
  group: enterprise-frontend-source-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-source:
    name: Importação verificada da fonte recuperada
    if: github.event.pull_request.head.ref == 'enterprise/6-equipes-consolidacao' || github.ref == 'refs/heads/enterprise/6-equipes-consolidacao'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise/6-equipes-consolidacao
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências raiz sem scripts de terceiros
        run: npm ci --ignore-scripts
      - name: Validar checksums e importar apenas arquivos ausentes
        run: bash scripts/import-enterprise-frontend-source.sh
