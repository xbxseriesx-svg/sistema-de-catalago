name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/editor-visual-pro
      - feature/asteryon-ai
      - feature/editor-freedom-v2
      - feature/hostinger-free-canvas
      - feature/import-produtos-winthor
      - feature/editor-creative-v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
