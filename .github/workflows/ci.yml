name: Windows 11 v2.1 Final

on:
  push:
    branches:
      - build/windows11-unified-v2.1-final
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recover v2.1 source
        shell: pwsh
        run: |
          $ordered = @(
            'v21-final/chunks/00.b64','v21-final/chunks/00_tail.b64','v21-final/chunks/01.b64','v21-final/chunks/02.b64',
            'v21-final/chunks/03.b64','v21-final/chunks/04.b64','v21-final/chunks/05.b64','v21-final/chunks/06_07.b64',
            'v21-final/chunks/08_09.b64','v21-final/chunks/10_11.b64','v21-final/chunks/12_13.b64','v21-final/chunks/14.b64',
            'v21-final/chunks/15.b64','v21-final/chunks/16.b64','v21-final/chunks/17.b64','v21-final/chunks/18.b64'
          )
          $pieces = @()
          foreach ($part in $ordered) {
            $s = (Get-Content $part -Raw) -replace '\s',''
            if ($part -like '*10_11*' -or $part -like '*12_13*') { $s = $s.Substring(0,16000) }
            $pieces += $s
          }
          $b64 = $pieces -join ''
          if ($b64.Length -ne 145988) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\source-recovered.zip", [Convert]::FromBase64String($b64))
          Write-Host "Recovered archive SHA256=$((Get-FileHash "$PWD\source-recovered.zip" -Algorithm SHA256).Hash.ToLower())"

          New-Item -ItemType Directory -Force app | Out-Null
          & 7z x source-recovered.zip -oapp -y '-x!package-lock.json' '-x!.gitignore' '-x!tsconfig.node.json' '-x!tsconfig.app.json' '-x!.bolt/*'
          if ($LASTEXITCODE -gt 1) { throw "7-Zip extraction failed with exit code $LASTEXITCODE" }

          @'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2023"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "isolatedModules": true,
              "moduleDetection": "force",
              "noEmit": true,
              "strict": true,
              "noUnusedLocals": false,
              "noUnusedParameters": false,
              "noFallthroughCasesInSwitch": true
            },
            "include": ["vite.config.ts"]
          }
          '@ | Set-Content app/tsconfig.node.json -Encoding UTF8

          @'
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "isolatedModules": true,
              "moduleDetection": "force",
              "noEmit": true,
              "jsx": "react-jsx",
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] },
              "strict": true,
              "noUnusedLocals": false,
              "noUnusedParameters": false,
              "noFallthroughCasesInSwitch": true
            },
            "include": ["src"]
          }
          '@ | Set-Content app/tsconfig.app.json -Encoding UTF8

          if (-not (Test-Path app/package.json)) { throw 'package.json missing after recovery' }
          if (-not (Test-Path app/src/App.tsx)) { throw 'src/App.tsx missing after recovery' }
          New-Item -ItemType Directory -Force app/desktop | Out-Null
          Copy-Item v21-final/main.cjs app/desktop/main.cjs -Force
          Set-Location app
          npm pkg set version=2.1.0-test
          npm pkg set main=desktop/main.cjs

      - name: Install dependencies
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev electron@43.2.0 electron-builder@26.0.12 --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Build Windows installer
        working-directory: app
        run: npx electron-builder --win nsis --x64 --config ../v21-final/electron-builder.yml

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $exe = Get-ChildItem app/release/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not generated' }
          $target = 'output/ASTERYON_Catalogo_Unificado_Setup_Windows11_TESTE_2.1.0-test.exe'
          Copy-Item $exe.FullName $target
          $sha = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          "ASTERYON Catálogo Digital v2.1 TESTE`r`nWindows 11 x64`r`nSHA-256: $sha" | Set-Content output/LEIA-ME.txt -Encoding UTF8
          Compress-Archive output/* ASTERYON_Catalogo_Unificado_Windows11_v2.1_TESTE_Completo.zip -Force
          Write-Host "EXE SHA256: $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: ASTERYON-Catalogo-Windows11-v2.1-FINAL
          path: |
            output/*
            ASTERYON_Catalogo_Unificado_Windows11_v2.1_TESTE_Completo.zip
          if-no-files-found: error
