name: Deploy catálogo V59 — Cloudflare + Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy-v58.yml'

permissions:
  contents: read

concurrency:
  group: catalogo-v59-cloudflare-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar segredos
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Aplicar correção compacta do importador V59
        run: node scripts/patch-importer-v59.mjs

      - name: Validar V59, Worker, modelo e importação
        run: npm test

      - name: Publicar V59
        run: npx wrangler deploy --keep-vars

      - name: Verificar produção V59
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://sistema-de-catalago.xbxseriesx-svg.workers.dev';
          for (const path of ['/api/health', '/api/auth/status']) {
            const response = await fetch(`${base}${path}`);
            const payload = await response.text();
            if (!response.ok) {
              throw new Error(`${path} retornou ${response.status}: ${payload.slice(0, 300)}`);
            }
            const data = JSON.parse(payload);
            if (!data.ok) throw new Error(`${path} retornou ok=false`);
          }
          NODE
