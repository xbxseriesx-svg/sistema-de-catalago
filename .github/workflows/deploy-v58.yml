name: Deploy catálogo V58 — Cloudflare + Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy-v58.yml'

permissions:
  contents: read

concurrency:
  group: catalogo-v58-cloudflare-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SDM_BOOTSTRAP_TOKEN: ${{ secrets.SDM_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar segredos
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$SUPABASE_SECRET_KEY$SUPABASE_SERVICE_ROLE_KEY" || (echo "Falta SUPABASE_SECRET_KEY ou SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$SDM_BOOTSTRAP_TOKEN" || (echo "Falta SDM_BOOTSTRAP_TOKEN" && exit 1)

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar V58, Worker e importação
        run: npm test

      - name: Preparar segredos do primeiro deploy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const secrets = {
            SDM_BOOTSTRAP_TOKEN: process.env.SDM_BOOTSTRAP_TOKEN
          };
          if (process.env.SUPABASE_SECRET_KEY) secrets.SUPABASE_SECRET_KEY = process.env.SUPABASE_SECRET_KEY;
          if (process.env.SUPABASE_SERVICE_ROLE_KEY) secrets.SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          writeFileSync('.secrets.json', JSON.stringify(secrets));
          NODE

      - name: Publicar V58
        run: npx wrangler deploy --secrets-file .secrets.json

      - name: Verificar produção V58
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://sistema-de-catalago.xbxseriesx-svg.workers.dev';
          for (const path of ['/api/health', '/api/auth/status']) {
            const response = await fetch(`${base}${path}`);
            const payload = await response.text();
            if (!response.ok) {
              throw new Error(`${path} retornou ${response.status}: ${payload.slice(0, 300)}`);
            }
            const data = JSON.parse(payload);
            if (!data.ok) throw new Error(`${path} retornou ok=false`);
          }
          NODE

      - name: Remover arquivo temporário
        if: always()
        shell: bash
        run: rm -f .secrets.json
