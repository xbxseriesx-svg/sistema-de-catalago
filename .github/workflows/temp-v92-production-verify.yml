name: TEMP V92 production verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-v92-production-verify.yml'

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirmar V92 no Worker publicado
        id: live
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sistema-de-catalago.xbxseriesx.workers.dev'
          ok=0
          health=''
          admin=''
          for attempt in $(seq 1 36); do
            echo "Tentativa ${attempt}/36"
            health="$(curl -fsS --max-time 15 "${BASE}/api/health" 2>/dev/null || true)"
            admin="$(curl -fsS --max-time 20 "${BASE}/admin" 2>/dev/null || true)"
            if printf '%s' "$health" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"V92"' \
              && printf '%s' "$admin" | grep -Fq 'ASTERYON Editor V92' \
              && printf '%s' "$admin" | grep -Fq 'preview-editor-v92-team4.js?v=92' \
              && printf '%s' "$admin" | grep -Fq 'index-V60Excel.js?v=92'; then
              ok=1
              break
            fi
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo 'Produção ainda não confirmou V92.' >&2
            echo "Health recebido: ${health}" >&2
            exit 1
          fi

          mkdir -p docs
          {
            echo 'ASTERYON Catálogo — V92 produção verificada'
            echo "Verificado em UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Endpoint: ${BASE}"
            echo "Health: ${health}"
            echo 'Admin: ASTERYON Editor V92'
            echo 'Asset: preview-editor-v92-team4.js?v=92'
            echo 'Bundle: index-V60Excel.js?v=92'
            echo 'Resultado: PRODUÇÃO V92 CONFIRMADA'
          } > docs/production-v92-live-verified.txt

      - name: Registrar evidência e remover verificador temporário
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-v92-production-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/production-v92-live-verified.txt .github/workflows/temp-v92-production-verify.yml
          git commit -m 'ops: record verified V92 production [skip ci]'
          git push origin HEAD:main
