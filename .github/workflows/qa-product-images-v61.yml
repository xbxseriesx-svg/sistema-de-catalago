name: QA catálogo V63 — Supabase + Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/supabase-v62-import-progress
      - fix/catalog-live-v63
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: catalogo-v63-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Diagnosticar catálogo compilado
        run: node scripts/inspect-catalog-v63.mjs

      - name: Validar catálogo, Supabase e Worker
        run: npm test
