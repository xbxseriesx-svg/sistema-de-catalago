name: QA catálogo V80 — Vínculos + Ofertas + Marketing + Supabase + Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit-v80
      - feature/template-preview-v69
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: catalogo-v80-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar Vínculos, Ofertas, Marketing, catálogo, previews, Supabase e Worker
        run: npm test
