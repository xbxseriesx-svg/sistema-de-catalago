name: QA catálogo V81 — auditoria integral

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit-v80
      - audit-v81-full-system
      - feature/template-preview-v69
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: catalogo-v81-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Executar auditoria integral e regressões
        run: npm test

      - name: Materializar Modelo Oficial testado
        if: github.ref == 'refs/heads/audit-v81-full-system'
        run: |
          if ! git diff --quiet -- scripts/modelo-oficial.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/modelo-oficial.mjs
            git commit -m "build: materialize Modelo Oficial V81 [skip ci]"
            git push
          fi
