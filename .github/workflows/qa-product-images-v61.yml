name: QA catálogo V81 — auditoria integral

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit-v80
      - audit-v81-full-system
      - feature/template-preview-v69
      - fix/brand-node-logo-popup-v85
    paths:
      - 'worker/**'
      - 'public/**'
      - 'supabase/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'public/**'
      - 'supabase/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: catalogo-v81-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Executar auditoria integral e regressões
        run: npm test

  e2e:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências do projeto
        run: npm ci --ignore-scripts

      - name: Materializar bundle auditado
        run: npm run prepare:bundle

      - name: Instalar Playwright somente no ambiente de QA
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Executar E2E real em Chromium
        run: npx playwright test --config=playwright.config.mjs

      - name: Publicar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v90
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
