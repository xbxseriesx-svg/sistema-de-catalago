name: TEMP V92 self cleanup

on:
  push:
    branches:
      - audit/v92-team4-preview-parity-20260820

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v92-team4-preview-parity-20260820
      - name: Remover somente artefatos temporários de diagnóstico
        run: |
          rm -f docs/v92-template-apply-diagnostic.txt
          rm -f .github/workflows/temp-v92-self-cleanup.yml
      - name: Gravar branch final limpa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/v92-template-apply-diagnostic.txt .github/workflows/temp-v92-self-cleanup.yml
          if git diff --cached --quiet; then
            echo 'Nenhum artefato temporário restante.'
            exit 0
          fi
          git commit -m "chore: remove V92 temporary diagnostics [skip ci]"
          git push origin HEAD:audit/v92-team4-preview-parity-20260820
