name: TEMP V93 fix template discovery

on:
  push:
    branches:
      - audit/v93-filled-preview-source-20260820

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v93-filled-preview-source-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Corrigir descoberta V93
        run: |
          node scripts/patch-v93-template-discovery.mjs
          node --check public/preview-editor-v93-source.js
      - name: Materializar e remover workflow temporário
        run: |
          rm -f .github/workflows/temp-v93-fix-template-discovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'fix(v93): materialize normalized template discovery [skip ci]'
            git push origin HEAD:audit/v93-filled-preview-source-20260820
          fi