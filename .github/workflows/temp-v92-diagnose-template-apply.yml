name: TEMP V92 diagnose template apply

on:
  push:
    branches:
      - audit/v92-team4-preview-parity-20260820

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v92-team4-preview-parity-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extrair somente contextos do fluxo de aplicação de template
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('public/assets/index-V60Excel.js', 'utf8');
          const needles = [
            'Modelo aplicado',
            'modelo aplicado',
            'Aplicar modelo',
            'aplicar modelo',
            '/api/admin/templates',
            '/api/admin/pages/home/draft',
            'templates',
          ];
          const out = [];
          for (const needle of needles) {
            let from = 0;
            let count = 0;
            while (count < 20) {
              const at = src.indexOf(needle, from);
              if (at < 0) break;
              count += 1;
              out.push(`\n===== ${needle} #${count} @ ${at} =====\n`);
              out.push(src.slice(Math.max(0, at - 1800), Math.min(src.length, at + needle.length + 2400)));
              out.push('\n');
              from = at + needle.length;
            }
          }
          fs.mkdirSync('docs', { recursive: true });
          fs.writeFileSync('docs/v92-template-apply-diagnostic.txt', out.join('\n'));
          console.log(`Diagnóstico gerado com ${out.length} blocos/partes.`);
          NODE
      - name: Gravar diagnóstico temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v92-template-apply-diagnostic.txt
          git commit -m "chore: capture V92 template apply diagnostic [skip ci]"
          git push origin HEAD:audit/v92-team4-preview-parity-20260820
