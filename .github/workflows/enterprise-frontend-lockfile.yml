name: Enterprise — Frontend Lockfile Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-frontend-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Validar lockfile determinístico do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar lockfile versionado
        working-directory: frontend
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (!p.lockfileVersion || !p.packages) process.exit(1)"
      - name: Instalação determinística sem scripts de terceiros
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirmar árvore instalada e imutabilidade do lockfile
        working-directory: frontend
        run: |
          npm ls --depth=0
          git diff --exit-code -- package.json package-lock.json
      - name: Publicar lockfile para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
